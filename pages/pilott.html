<div class="page" id="page-pilott">

  <!-- ── Topbar ── -->
  <div class="topbar">
    <div>
      <div class="page-title">Pilott <span>· Gestão de Tarefas</span></div>
      <div class="page-date" id="pilott-date"></div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-ghost" id="clearDoneBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
        Limpar concluídas
      </button>
      <button class="btn btn-primary" id="newTaskBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Nova tarefa
      </button>
    </div>
  </div>

  <!-- ── Status msg ── -->
  <div class="status-msg" id="statusMsg"></div>

  <!-- ── Barra de visão admin (só aparece para nivel >= 4) ── -->
  <div class="pilott-broker-bar" id="pilott-broker-bar" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;flex-shrink:0"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    <span>Visualizando Pilott de:</span>
    <select id="pilott-broker-select">
      <option value="">Todos / Visão geral</option>
    </select>
  </div>

  <!-- ── Urgências ── -->
  <div class="pilott-urgency" id="urgencyBox">
    <div class="urgency-header">
      <span class="urgency-fire">🔥</span>
      <div class="urgency-title">URGÊNCIAS</div>
      <div class="urgency-count" id="urgencyCount">0</div>
      <button class="urgency-add-btn" id="urgencyAddBtn" title="Nova urgência">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="urgency-list" id="urgencyList"></div>
  </div>

  <!-- ── Board ── -->
  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

</div>

<!-- ══════════════════════════════════════════════
     MODAL: Nova / Editar Tarefa
══════════════════════════════════════════════ -->
<div class="overlay" id="taskOverlay" style="display:none">
  <div class="modal pilott-modal">

    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Nova tarefa</h2>
      <button class="modal-close-btn" id="modalCloseBtn" title="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="modal-body">

      <!-- Linha 1: Título -->
      <div class="form-group">
        <label class="form-label" for="fTitle">Título <span class="required">*</span></label>
        <input class="form-control" id="fTitle" type="text" placeholder="Ex: Ligar para cliente sobre rebalanceamento" autocomplete="off">
      </div>

      <!-- Linha 2: Descrição -->
      <div class="form-group">
        <label class="form-label" for="fDesc">Descrição</label>
        <textarea class="form-control" id="fDesc" rows="3" placeholder="Detalhes adicionais da tarefa…"></textarea>
      </div>

      <!-- Linha 3: Coluna + Prioridade -->
      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="fStatus">Coluna</label>
          <select class="form-control" id="fStatus"></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="fPriority">Prioridade</label>
          <select class="form-control" id="fPriority">
            <option value="baixa">🟢 Baixa</option>
            <option value="media" selected>🟡 Média</option>
            <option value="alta">🔴 Alta</option>
          </select>
        </div>
      </div>

      <!-- Linha 4: Prazo + Código cliente -->
      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="fDue">Prazo</label>
          <input class="form-control" id="fDue" type="date">
        </div>
        <div class="form-group">
          <label class="form-label" for="fClientCode">Código do cliente</label>
          <input class="form-control" id="fClientCode" type="text" placeholder="Ex: CLI001" autocomplete="off">
        </div>
      </div>

      <!-- Linha 5: AAI -->
      <div class="form-group">
        <label class="form-label" for="fAai">AAI responsável</label>
        <select class="form-control" id="fAai">
          <option value="">— Nenhum —</option>
        </select>
      </div>

      <!-- Linha 6: Brokers compartilhados -->
      <div class="form-group">
        <label class="form-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;vertical-align:middle;margin-right:4px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Brokers envolvidos
        </label>
        <div class="broker-checkboxes" id="fBrokersContainer"></div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" id="cancelBtn">Cancelar</button>
      <button class="btn btn-primary" id="saveBtn">Salvar tarefa</button>
    </div>

  </div>
</div>

<!-- ══════════════════════════════════════════════
     MODAL: Visualizar Tarefa
══════════════════════════════════════════════ -->
<div class="overlay" id="viewOverlay" style="display:none">
  <div class="modal pilott-modal">

    <div class="modal-header">
      <h2 class="modal-title" id="viewTitle">—</h2>
      <button class="modal-close-btn" id="viewCloseIconBtn" title="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <p class="view-desc" id="viewDesc"></p>
      <div class="view-grid" id="viewGrid"></div>
      <p class="view-timestamps" id="viewTimestamps"></p>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost danger" id="viewDeleteBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
        Excluir
      </button>
      <button class="btn btn-primary" id="viewEditBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4Z"/></svg>
        Editar
      </button>
      <button class="btn btn-ghost" id="viewCloseBtn">Fechar</button>
    </div>

  </div>
</div>
