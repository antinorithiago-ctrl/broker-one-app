<div class="page" id="page-parametrizacao">
  <div class="topbar">
    <div><div class="page-title">Parametrização <span>· Base do Squad</span></div><div class="page-date" id="param-date"></div></div>
    <div class="topbar-right">
      <div id="param-batch-bar" style="display:none;align-items:center;gap:8px;">
        <span id="param-sel-count" style="font-family:var(--font-mono);font-size:11px;color:var(--text-3);"></span>
        <button class="btn btn-ghost" onclick="paramEditarLote()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>Editar campo</button>
        <button class="btn btn-danger" onclick="paramExcluirLote()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>Excluir selecionados</button>
        <button class="btn btn-ghost" onclick="paramDeselecionarTudo()">Cancelar</button>
      </div>
      <button class="btn btn-ghost" onclick="importParamCSV()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M12 3v12M7 8l5-5 5 5"/></svg>Importar CSV</button>
      <button class="btn btn-ghost" onclick="exportParamCSV()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 3v12"/></svg>Exportar CSV</button>
      <button class="btn btn-primary" onclick="openParamModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Novo Registro</button>
    </div>
  </div>
  <div style="background:#FFF;border-bottom:1px solid var(--border);padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex-shrink:0;">
    <div class="search-wrap" style="max-width:220px;flex-shrink:0;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="param-search" placeholder="Buscar geral..." oninput="renderParam()"/>
    </div>
    <select id="pf-praca"    class="param-filter" onchange="renderParam()" style="font-size:11px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-family:'Montserrat',sans-serif;color:var(--text-primary);background:#FFF;min-width:140px;"><option value="">Todas as Praças</option></select>
    <select id="pf-lider"    class="param-filter" onchange="renderParam()" style="font-size:11px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-family:'Montserrat',sans-serif;color:var(--text-primary);background:#FFF;min-width:130px;"><option value="">Todos os Líderes</option></select>
    <select id="pf-assessor" class="param-filter" onchange="renderParam()" style="font-size:11px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-family:'Montserrat',sans-serif;color:var(--text-primary);background:#FFF;min-width:160px;"><option value="">Todos os Assessores</option></select>
    <select id="pf-advisor"  class="param-filter" onchange="renderParam()" style="font-size:11px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-family:'Montserrat',sans-serif;color:var(--text-primary);background:#FFF;min-width:150px;"><option value="">Todos os Advisors</option></select>
    <select id="pf-broker"   class="param-filter" onchange="renderParam()" style="font-size:11px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-family:'Montserrat',sans-serif;color:var(--text-primary);background:#FFF;min-width:160px;"><option value="">Todos os Brokers</option></select>
    <button onclick="clearParamFilters()" style="font-size:11px;font-weight:600;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:#FFF;color:var(--text-muted);cursor:pointer;font-family:'Montserrat',sans-serif;" id="param-clear-btn">✕ Limpar</button>
    <span id="param-count" style="font-size:11px;color:var(--text-muted);margin-left:4px;"></span>
  </div>
  <div style="flex:1;overflow-y:auto;">
    <table class="flow-table">
      <thead><tr>
        <th style="width:36px;padding:6px 10px;"><input type="checkbox" id="param-chk-all" onchange="paramToggleTodos(this.checked)" style="width:14px;height:14px;accent-color:var(--coral);cursor:pointer;"/></th>
        <th>Praça</th><th>Líder</th><th>Cod AAI</th><th>Assessor</th>
        <th>Cod Advisor</th><th>Advisor</th><th>Cod Broker</th><th>Broker</th>
        <th>OBS</th><th></th>
      </tr></thead>
      <tbody id="param-tbody"></tbody>
    </table>
  </div>
</div>
